<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered list</title>
</head>
<body>
    <p>Unordered List: list and group related items for better readability</p>
    <!-- Ul : unorded list | li: list | Items are listed with bullets -->
    <ul>
        <li>Apple</li>
        <li>banana</li>
    </ul>


    <p>Orded List: ol: list the items by numbering them</p>
    <ol>
        <li>laptop</li>
        <li>mouse</li>
        <li>keyboard</li>
    </ol>
</body>
</html>
