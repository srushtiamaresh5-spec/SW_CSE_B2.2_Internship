<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tag</title>
</head>
<body>
    <p>Video Tag example</p>
    <video src="/SW_CSE_B2.2_Internship/Day/video/Couch_Catalysts.mp4" controls type="video/mp4"></video>

    <!-- width & heigth -->
    <video src="/SW_CSE_B2.2_Internship/Day/video/Couch_Catalysts.mp4" controls type="video/mp4" width="640" height="360"></video>

    <!-- autoplay -->
    <video src="/SW_CSE_B2.2_Internship/Day/video/Couch_Catalysts.mp4" controls type="video/mp4" autoplay></video>

    <!-- Muted  -->
    <video src="/SW_CSE_B2.2_Internship/Day/video/Couch_Catalysts.mp4" controls autoplay muted width="640" height="360"></video>

    <!-- loop -->
    <video src="/SW_CSE_B2.2_Internship/Day/video/Couch_Catalysts.mp4" controls loop autoplay muted loop width="640" height="360"></video>

    <!-- poster -->
     <video src="/SW_CSE_B2.2_Internship/Day/video/Couch_Catalysts.mp4" controls type="video/mp4"  poster="/SW_CSE_B2.2_Internship/Day/images/Couch_Catalysts.jpeg"></video>

</body>
</html>
