<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tag</title>
</head>
<body>
    <p>Video Tag example</p>
    <video src="" controls type=""></video>

    <!-- width & heigth -->
    <video src="" controls type="" width="640" height="360"></video>

    <!-- autoplay -->
    <video src="" controls type="" autoplay></video>

    <!-- Muted  -->
    <video src="" controls autoplay muted width="" height=""></video>

    <!-- loop -->
    <video src="" controls loop autoplay muted loop width="" height=""></video>

    <!-- poster -->
     <video src="" controls type=""  poster=""></video>

</body>
</html>
